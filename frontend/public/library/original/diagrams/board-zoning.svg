<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="板书分区示意图">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33463D"/>
      <stop offset="100%" stop-color="#243329"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#FFFDF8"/>
      <circle cx="2" cy="3" r="0.7" fill="#E4DCCC"/>
      <circle cx="17" cy="19" r="0.6" fill="#EDE6D8"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#paper)"/>

  <text x="80" y="76" font-family="'Songti SC','SimSun',serif" font-size="42" font-weight="700" fill="#2C2730" letter-spacing="2">板书分区示意</text>
  <text x="80" y="112" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8B8578">临客整理 · 片段教学训练用 · 非正式国标</text>
  <line x1="80" y1="128" x2="1200" y2="128" stroke="#D9D0C0" stroke-width="1"/>

  <!-- 黑板外框 -->
  <rect x="80" y="158" width="1120" height="516" rx="16" fill="#B98A5A" opacity="0.18"/>
  <rect x="88" y="166" width="1104" height="500" rx="12" fill="url(#board)" stroke="#8A6A45" stroke-width="3"/>

  <!-- 标题区 -->
  <rect x="120" y="196" width="1040" height="82" rx="8" fill="none" stroke="#F4F1E6" stroke-width="1.6" stroke-dasharray="9 7" opacity="0.85"/>
  <text x="142" y="228" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#9FD8C4" letter-spacing="3">① 标题区 · 通栏</text>
  <text x="142" y="260" font-family="'Songti SC','SimSun',serif" font-size="24" fill="#F7F4EA">课题 / 学习目标（一句话，不许空着）</text>

  <!-- 主板书区 -->
  <rect x="120" y="298" width="620" height="336" rx="8" fill="none" stroke="#F4F1E6" stroke-width="1.6" stroke-dasharray="9 7" opacity="0.85"/>
  <text x="142" y="330" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#9FD8C4" letter-spacing="3">② 主板书 · 概念与例证</text>
  <line x1="430" y1="352" x2="430" y2="606" stroke="#F4F1E6" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <text x="150" y="392" font-family="'Songti SC','SimSun',serif" font-size="21" fill="#F7F4EA">平均分 → 每份同样多</text>
  <text x="150" y="432" font-family="'Songti SC','SimSun',serif" font-size="21" fill="#F7F4EA">1/2 读作：二分之一</text>
  <text x="150" y="472" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#CBD9D0">概念只写关键词，不抄讲稿</text>

  <text x="456" y="392" font-family="'Songti SC','SimSun',serif" font-size="21" fill="#F7F4EA">图：圆平均分成 2 份</text>
  <circle cx="500" cy="470" r="46" fill="none" stroke="#F7F4EA" stroke-width="2"/>
  <path d="M500 424 L500 516" stroke="#F7F4EA" stroke-width="2"/>
  <path d="M500 424 A46 46 0 0 1 500 516 Z" fill="#FFC38A" opacity="0.55"/>
  <text x="570" y="478" font-family="'Songti SC','SimSun',serif" font-size="22" fill="#FFC38A">涂色 = 1/2</text>

  <!-- 副板书区 -->
  <rect x="764" y="298" width="396" height="336" rx="8" fill="none" stroke="#F4F1E6" stroke-width="1.6" stroke-dasharray="9 7" opacity="0.85"/>
  <text x="786" y="330" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#9FD8C4" letter-spacing="3">③ 副板书 · 随讲随写</text>
  <text x="790" y="378" font-family="'Songti SC','SimSun',serif" font-size="19" fill="#F7F4EA">追问：为什么不是 1/3？</text>
  <text x="790" y="416" font-family="'Songti SC','SimSun',serif" font-size="19" fill="#F7F4EA">易错：随便分 ≠ 平均分</text>
  <text x="790" y="454" font-family="'Songti SC','SimSun',serif" font-size="19" fill="#F7F4EA">学生回答：小明说……</text>
  <text x="790" y="492" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#CBD9D0">写完可擦，不算正式结构</text>
  <rect x="790" y="520" width="344" height="86" rx="6" fill="none" stroke="#FFC38A" stroke-width="1.4" stroke-dasharray="5 6"/>
  <text x="806" y="556" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#FFC38A">④ 擦改区：临时演算、误写</text>
  <text x="806" y="584" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#FFC38A">擦完不留半句，保持可读</text>

  <!-- 底部说明 -->
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="80" y="702" width="352" height="56" rx="10" fill="#FFF4E8" stroke="#F3D5B6"/>
    <text x="100" y="726" font-size="15" font-weight="700" fill="#B4621A">分区原则</text>
    <text x="100" y="747" font-size="13" fill="#7A5230">左重右轻、上标题下演算，扫一眼能读懂结构</text>

    <rect x="452" y="702" width="380" height="56" rx="10" fill="#FDF0F0" stroke="#F0CACA"/>
    <text x="472" y="726" font-size="15" font-weight="700" fill="#A6403A">三个常见错误</text>
    <text x="472" y="747" font-size="13" fill="#7A4140">整板抄讲稿 / 没有标题 / 擦改把主体结构擦掉</text>

    <rect x="852" y="702" width="308" height="56" rx="10" fill="#EFF6F1" stroke="#C9E0D2"/>
    <text x="872" y="726" font-size="15" font-weight="700" fill="#2F6B4F">训练自检</text>
    <text x="872" y="747" font-size="13" fill="#3D5F4C">板书自检 8 条见资源库同名清单</text>
  </g>
</svg>
