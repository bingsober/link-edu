<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="十分钟片段教学时间分配示意图">
  <defs>
    <pattern id="paper4" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#FFFDF8"/>
      <circle cx="5" cy="6" r="0.7" fill="#E4DCCC"/>
      <circle cx="19" cy="22" r="0.6" fill="#EDE6D8"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#paper4)"/>
  <text x="90" y="76" font-family="'Songti SC','SimSun',serif" font-size="42" font-weight="700" fill="#2C2730" letter-spacing="2">10 分钟片段：时间花在哪</text>
  <text x="90" y="112" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8B8578">临客整理 · 训前把环节写在教案栏 · 经验建议，非正式国标</text>
  <line x1="90" y1="128" x2="1190" y2="128" stroke="#D9D0C0" stroke-width="1"/>

  <!-- 主时间条 -->
  <rect x="120" y="186" width="104" height="66" rx="8" fill="#FF7A18"/>
  <rect x="224" y="186" width="312" height="66" rx="8" fill="#2F6B4F"/>
  <rect x="536" y="186" width="312" height="66" rx="8" fill="#7E4A72"/>
  <rect x="848" y="186" width="208" height="66" rx="8" fill="#2C5F7C"/>
  <rect x="1056" y="186" width="104" height="66" rx="8" fill="#8A6A45"/>

  <g font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="172" y="212">导入</text><text x="172" y="234" font-size="12" font-weight="400">1′</text>
    <text x="380" y="212">新授</text><text x="380" y="234" font-size="12" font-weight="400">3′</text>
    <text x="692" y="212">练习 / 追问</text><text x="692" y="234" font-size="12" font-weight="400">3′</text>
    <text x="952" y="212">巩固</text><text x="952" y="234" font-size="12" font-weight="400">2′</text>
    <text x="1108" y="212">小结</text><text x="1108" y="234" font-size="12" font-weight="400">1′</text>
  </g>

  <g font-family="system-ui,'PingFang SC',sans-serif" font-size="12" fill="#A29A8C" text-anchor="middle">
    <text x="120" y="278">0′</text><text x="224" y="278">1′</text><text x="536" y="278">4′</text>
    <text x="848" y="278">7′</text><text x="1056" y="278">9′</text><text x="1160" y="278">10′</text>
  </g>

  <!-- 环节卡片 -->
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- 导入 -->
    <rect x="120" y="316" width="244" height="196" rx="12" fill="#FFF4E8" stroke="#F3D5B6"/>
    <text x="142" y="348" font-size="16" font-weight="700" fill="#B4621A">0—1′ 导入</text>
    <text x="142" y="378" font-size="13" fill="#7A5230">· 一句话情境（分蛋糕/分苹果）</text>
    <text x="142" y="402" font-size="13" fill="#7A5230">· 抛学习任务，点明课题</text>
    <text x="142" y="426" font-size="13" fill="#7A5230">· 板书课题</text>
    <line x1="142" y1="446" x2="342" y2="446" stroke="#F0D9BE"/>
    <text x="142" y="472" font-size="12" font-weight="700" fill="#B4621A">自检</text>
    <text x="142" y="494" font-size="12" fill="#8A6A45">30 秒内必须说到“平均分”</text>

    <!-- 新授 -->
    <rect x="380" y="316" width="356" height="196" rx="12" fill="#EFF6F1" stroke="#C9E0D2"/>
    <text x="402" y="348" font-size="16" font-weight="700" fill="#2F6B4F">1—4′ 新授</text>
    <text x="402" y="378" font-size="13" fill="#3D5F4C">· 动手分：让学生指图说“每份同样多”</text>
    <text x="402" y="402" font-size="13" fill="#3D5F4C">· 写分数：1/2 的读写与各部分名称</text>
    <text x="402" y="426" font-size="13" fill="#3D5F4C">· 主板书成型（概念 + 图例）</text>
    <line x1="402" y1="446" x2="714" y2="446" stroke="#CBE0D3"/>
    <text x="402" y="472" font-size="12" font-weight="700" fill="#2F6B4F">自检</text>
    <text x="402" y="494" font-size="12" fill="#4F7A62">学生开口 ≥ 2 次，不是我一个人讲</text>

    <!-- 练习 -->
    <rect x="752" y="316" width="264" height="196" rx="12" fill="#F7F0F5" stroke="#DDC7D7"/>
    <text x="774" y="348" font-size="16" font-weight="700" fill="#7E4A72">4—7′ 练习 / 追问</text>
    <text x="774" y="378" font-size="13" fill="#6E4A66">· 一道判断题 + 一次指名</text>
    <text x="774" y="402" font-size="13" fill="#6E4A66">· 追问“为什么不是 1/3”</text>
    <text x="774" y="426" font-size="13" fill="#6E4A66">· 副板书记录学生原话</text>
    <line x1="774" y1="446" x2="994" y2="446" stroke="#E2CEDD"/>
    <text x="774" y="472" font-size="12" font-weight="700" fill="#7E4A72">自检</text>
    <text x="774" y="494" font-size="12" fill="#8A5E80">候答 3 秒以上，别抢答</text>

    <!-- 巩固 + 小结 -->
    <rect x="1032" y="316" width="158" height="196" rx="12" fill="#EFF3F7" stroke="#C6D6E2"/>
    <text x="1054" y="348" font-size="16" font-weight="700" fill="#2C5F7C">7—9′ 巩固</text>
    <text x="1054" y="378" font-size="13" fill="#3B5A70">· 易错对照</text>
    <text x="1054" y="402" font-size="13" fill="#3B5A70">（随便分 ≠ 平均分）</text>
    <text x="1054" y="432" font-size="13" fill="#3B5A70">9—10′ 小结</text>
    <text x="1054" y="456" font-size="13" fill="#3B5A70">· 一句话回扣目标</text>
    <text x="1054" y="486" font-size="12" fill="#6D8AA0">别拖堂，铃响前收住</text>
  </g>

  <!-- 8 分钟压缩版 -->
  <rect x="120" y="552" width="1040" height="112" rx="14" fill="#FFFFFF" stroke="#E5DDCE"/>
  <text x="146" y="584" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#2C2730">8 分钟压缩版（面试常见）</text>

  <rect x="146" y="600" width="130" height="30" rx="6" fill="#FF7A18" opacity="0.85"/>
  <text x="211" y="621" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#fff">导入 1′</text>
  <rect x="282" y="600" width="390" height="30" rx="6" fill="#2F6B4F" opacity="0.85"/>
  <text x="477" y="621" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#fff">新授 3′</text>
  <rect x="678" y="600" width="260" height="30" rx="6" fill="#7E4A72" opacity="0.85"/>
  <text x="808" y="621" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#fff">追问 2′</text>
  <rect x="944" y="600" width="190" height="30" rx="6" fill="#2C5F7C" opacity="0.85"/>
  <text x="1039" y="621" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#fff">小结 2′</text>

  <text x="146" y="654" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#7A7266">压缩时优先保住两件事：把“平均分”讲透、留一次真正的追问；宁可少讲一个例子，也别把小结挤没。</text>

  <text x="120" y="716" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#A29A8C">配合使用：资源库「10 分钟片段时间分配表」可打印对照；「板书分区示意」用于同步规划板书。</text>
</svg>
