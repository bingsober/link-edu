<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="结构化面试七天轮训表封面">
  <defs>
    <pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FFFDF8"/>
      <circle cx="3" cy="4" r="0.7" fill="#E8E0D0"/>
      <circle cx="17" cy="18" r="0.6" fill="#EFE8DA"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#p)"/>
  <rect x="0" y="0" width="800" height="10" fill="#3B4A8C"/>
  <rect x="56" y="58" width="414" height="34" rx="17" fill="#E4E7F5"/>
  <text x="263.0" y="81" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3B4A8C">实操清单 · 训练安排</text>

  <text x="56" y="176" font-family="'Songti SC','SimSun',serif" font-size="38" font-weight="700" fill="#2C2730">结构化七天轮训表</text>
  <text x="56" y="222" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#8B8578">每天 30 分钟，六类题型轮一遍</text>

  <line x1="56" y1="268" x2="200" y2="268" stroke="#3B4A8C" stroke-width="3"/>

  <g font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#A29A8C">
    <text x="56" y="430">临客整理 · 二〇二六年</text>
    <text x="56" y="456">训练材料，非正式国标；引用请注明来源</text>
  </g>

  <text x="726" y="440" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="150" font-weight="700" fill="#E4E7F5">轮</text>
  <circle cx="726" cy="150" r="46" fill="none" stroke="#3B4A8C" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.5"/>
  <circle cx="726" cy="150" r="28" fill="#3B4A8C" opacity="0.12"/>
</svg>
