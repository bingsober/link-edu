      <circle cx="17" cy="18" r="0.6" fill="#EFE8DA"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#p)"/>
  <rect x="0" y="0" width="800" height="10" fill="#8A6A45"/>
  <rect x="56" y="58" width="163" height="34" rx="17" fill="#F4EDE2"/>
  <text x="137.5" y="81" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7A5230">训练文稿 · 备课</text>

